[app]
cloud-app  ansible_host=172.19.0.2 ansible_port=30030  ansible_user=cloud ansible_ssh_private_key_file=~/.ssh/private_cloud_ed25519
[db]
cloud-db ansible_host=172.19.0.2 ansible_port=30031     ansible_user=db   ansible_ssh_private_key_file=~/.ssh/private_cloud_ed25519
[storage]
cloud-storage ansible_host=172.19.0.2 ansible_port=30032   ansible_user=cloud     ansible_ssh_private_key_file=~/.ssh/private_cloud_ed25519
[ops]
cloud-ops ansible_host=172.19.0.2 ansible_port=30033   ansible_user=ops    ansible_ssh_private_key_file=~/.ssh/private_cloud_ed25519

[managed:children]
app
db
storage
ops
[managed:vars]
ansible_become=true
